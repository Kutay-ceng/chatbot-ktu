name: Issue Take Command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  take:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    concurrency:
      group: issue-take-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Handle ./take command
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment?.body || "").trim();
            if (body !== "./take") {
              core.info("Comment is not ./take, skipping.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });

            const assignees = (issue.assignees || []).map((user) => user.login);

            const createComment = async (message) => {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message,
              });
            };

            if (assignees.length > 0) {
              if (assignees.includes(commenter)) {
                await createComment(`@${commenter} this issue is already assigned to you.`);
                return;
              }

              const assigneeList = assignees.map((login) => `@${login}`).join(", ");
              await createComment(`This issue is already assigned to ${assigneeList}.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [commenter],
              });
              await createComment(`Assigned to @${commenter}.`);
            } catch (error) {
              const details = (error?.message || "Unknown error").split("\n")[0];
              await createComment(
                `I could not assign this issue to @${commenter}. A maintainer may need to grant access first.\n\nDetails: ${details}`
              );
            }
